name: Bug Report
description: report a bug 😮
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        before reporting, please test with **only SIP enabled** if you can 🙏

  - type: textarea
    id: mods-list
    attributes:
      label: List of Mods
      description: go to geode settings then click copy mods list and paste it here
      placeholder: paste ALL of your mods list here not actually just my mod 🫩🙏
    validations:
      required: true

  - type: dropdown
    id: sip-only
    attributes:
      label: Does it still happen with only SIP enabled?
      options: ["Yes", "No", "Haven't tested"]
    validations:
      required: true

  - type: dropdown
    id: cbf
    attributes:
      label: Does it happen with syzzi's CBF?
      options: ["Yes", "No", "Haven't tested"]

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: what happened, what you expected, and steps to reproduce (level name/ID and percentage help a lot if it's a specific level)
      placeholder: your mod is the best! 😁
    validations:
      required: true

  - type: textarea
    id: crashlog
    attributes:
      label: Crash Log
      description: if the game crashed, paste the newest file from geode's crashlogs folder
      render: shell

  - type: textarea
    id: media
    attributes:
      label: Media
      description: images or videos of the bug

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
      - "Windows"
      - "Mac (Intel)"
      - "Mac (Arm)"
      - "Android (32-bit)"
      - "Android (64-bit)"
      - "iOS (JIT)"
      - "iOS (Jitless)"
      - "Linux (Wine/Proton)"
    validations:
      required: true

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
      - label: I verify that Superb Input Precision is fully updated.
        required: true

  - type: markdown
    attributes:
      value: |
        ## Come Back Later
        check back in a few days to see if i've responded to your report
        
